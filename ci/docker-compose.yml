services:
  web:
    image: asna154/notes-app:latest
    container_name: notes-web-ci
    ports:
      - "8092:80"
    environment:
      DB_HOST: db
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASS: notespass123
      APP_LABEL: "Part II (Jenkins pipeline)"
    volumes:
      - ../app:/var/www/html:ro
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: notes-db-ci
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF", "--max-connections=20"]
    ports:
      - "3318:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpass123
      MARIADB_DATABASE: notesdb
      MARIADB_USER: notesuser
      MARIADB_PASSWORD: notespass123
    volumes:
      - notes_dbdata_ci:/var/lib/mysql

volumes:
  notes_dbdata_ci:
