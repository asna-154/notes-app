services:
  web:
    image: asna154/notes-app:latest
    container_name: notes-web
    ports:
      - "8091:80"
    environment:
      DB_HOST: db
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASS: notespass123
      APP_LABEL: "Part I (docker-compose on EC2)"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: notes-db
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF", "--max-connections=20"]
    ports:
      - "3317:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpass123
      MARIADB_DATABASE: notesdb
      MARIADB_USER: notesuser
      MARIADB_PASSWORD: notespass123
    volumes:
      - notes_dbdata:/var/lib/mysql
    restart: unless-stopped

volumes:
  notes_dbdata:
